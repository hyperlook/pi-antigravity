name: Publish Package to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag (例如: latest, legacy, beta)"
        required: true
        default: "latest"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        run: |
          bun_version="$(tr -d '[:space:]' < .bun-version)"
          curl -fsSL https://bun.sh/install | bash -s "bun-v${bun_version}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sync package version from tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Syncing package.json version to $TAG_VERSION from tag"
            bun -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$TAG_VERSION';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          fi

      - name: Run checks (typecheck, lint, format)
        run: bun run check

      - name: Determine npm dist-tag
        id: dist_tag
        run: |
          if [ -n "${{ github.event.inputs.npm_tag }}" ]; then
            TAG="${{ github.event.inputs.npm_tag }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          bun -e "
            fetch('https://registry.npmjs.org/-/whoami', {
              headers: { Authorization: 'Bearer ' + '${{ secrets.NPM_TOKEN }}' }
            })
            .then(res => res.json())
            .then(data => console.log('npm authenticated as:', data))
            .catch(err => console.error('npm whoami check error:', err));
          "

      - name: Publish to npm
        run: npm publish --access public --tag ${{ steps.dist_tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        run: |
          sleep 3
          npm view @gwylook/pi-antigravity versions

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
